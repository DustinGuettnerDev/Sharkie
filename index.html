<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="styles/overlay.css" />
        <link rel="stylesheet" href="styles/fonts.css" />
        <link rel="stylesheet" href="styles/responsive.css" />
        <link rel="stylesheet" href="styles/fullscreen.css" />
        <link rel="stylesheet" href="styles/utilities.css" />

        <script src="models/audio-track.class.js"></script>
        <script src="models/UI-controller.class.js"></script>
        <script src="models/drawable-object.class.js"></script>
        <script src="models/img-paths/img-paths.js"></script>
        <script src="models/audio-paths/audio-paths.js"></script>
        <script src="models/poison-bottle.class.js"></script>
        <script src="models/HUD.class.js"></script>
        <script src="models/factories/hud-icons.factory.js"></script>
        <script src="models/coin.class.js"></script>
        <script src="models/movable-object.class.js"></script>
        <script src="models/bubble.class.js"></script>
        <script src="models/mortal-object.class.js"></script>
        <script src="models/enemy.class.js"></script>
        <script src="models/regular-enemy.class.js"></script>
        <script src="models/puffer.class.js"></script>
        <script src="models/jelly-fish.class.js"></script>
        <script src="models/endboss.class.js"></script>
        <script src="models/character.class.js"></script>
        <script src="models/world.class.js"></script>
        <script src="models/background-object.class.js"></script>
        <script src="models/keyboards.class.js"></script>
        <script src="models/level.class.js"></script>
        <script src="levels/level1.js"></script>
        <script src="scripts/game.js"></script>
        <link rel="icon" type="image/svg+xml" href="assets/img/general/favicon/1.svg?v=5" />
        <title>Sharkie</title>
    </head>
    <body class="shark" onload="init()">
        <h1 class="shark__title">Sharkie</h1>

        <div id="game-container-id" class="game-container">
            <canvas class="game-container__canvas" id="canvas" width="720" height="480"></canvas>
            <button
                id="start-button-id"
                class="game-container__start-button"
                onclick="uiController.startGame()"
            ></button>
            <div id="game-end-container-id" class="game-container__end-screen hidden">
                <img
                    id="game-over-id"
                    class="game-container__game-over-image hidden"
                    src="assets/img/overlay/titles/game-over/1.png"
                    alt="Game Over"
                />
                <img
                    id="you-win-id"
                    class="game-container__you-win-image hidden"
                    src="assets/img/overlay/titles/you-win/1.png"
                    alt="You Win"
                />
                <button
                    id="restart-button-id"
                    class="game-container__restart-button"
                    onclick="uiController.restartGame()"
                ></button>
            </div>
            <button
                id="help-button-id"
                class="game-container__help-button"
                onclick="uiController.showHelp()"
            >
                help
            </button>
            <div id="help-id" class="game-container__help-overlay hidden">
                <div>
                    <img
                        class="game-container__help-move-key"
                        src="assets/img/overlay/key/arrow-keys/1.png"
                        alt="Beschreibung 1"
                    />
                </div>
                <div><p class="game-container__help-text">MOVE SHARK</p></div>
                <div>
                    <img
                        class="game-container__help-bubble-key"
                        src="assets/img/overlay/key/d-key/1.png"
                        alt="Beschreibung 2"
                    />
                </div>
                <div><p class="game-container__help-text">BUBBLE</p></div>
                <div>
                    <img
                        class="game-container__help-attack-key"
                        src="assets/img/overlay/key/space-bar/1.png"
                        alt="Beschreibung 3"
                    />
                </div>
                <div><p class="game-container__help-text">ATTACK</p></div>
            </div>

            <button
                id="fullscreen-button-id"
                class="game-container__fullscreen-button"
                onclick="uiController.toggleFullscreen()"
            >
                FULL
            </button>

            <button
                id="mute-button-id"
                class="game-container__mute-button"
                onclick="uiController.toggleMute()"
            >
                AUDIO
            </button>
        </div>
    </body>
</html>
