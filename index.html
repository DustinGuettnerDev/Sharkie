<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="styles/fonts.css" />
        <script src="models/UI-controller.class.js"></script>
        <script src="models/drawable-object.class.js"></script>
        <script src="models/imgs-paths/imgs-paths.js"></script>
        <script src="models/poison-bottle.class.js"></script>
        <script src="models/HUD.class.js"></script>
        <script src="models/factories/hud-icons.factory.js"></script>
        <script src="models/coin.class.js"></script>
        <script src="models/movable-object.class.js"></script>
        <script src="models/bubble.class.js"></script>
        <script src="models/mortal-object.class.js"></script>
        <script src="models/enemy.class.js"></script>
        <script src="models/regular-enemy.class.js"></script>
        <script src="models/puffer.class.js"></script>
        <script src="models/jelly-fish.class.js"></script>
        <script src="models/endboss.class.js"></script>
        <script src="models/character.class.js"></script>
        <script src="models/world.class.js"></script>
        <script src="models/background-object.class.js"></script>
        <script src="models/keyboards.class.js"></script>
        <script src="models/level.class.js"></script>
        <script src="levels/level1.js"></script>
        <script src="scripts/game.js"></script>
        <title>Sharkie</title>
    </head>
    <body class="background" onload="init()">
        <h1>Sharkie</h1>

        <div class="game-container">
            <canvas id="canvas" width="720" height="480"></canvas>
            <button
                id="start-button-id"
                class="start-button"
                onclick="uiController.startGame()"
            ></button>
            <div id="game-end-container-id" class="game-over-container hidden">
                <img
                    id="game-over-id"
                    class="game-over hidden"
                    src="img/6.Botones/Tittles/Game Over/Recurso 12.png"
                    alt="Game Over"
                />
                <img
                    id="you-win-id"
                    class="you-win hidden"
                    src="img/6.Botones/Tittles/You win/Recurso 21.png"
                    alt="You Win"
                />
                <button
                    id="restart-button-id"
                    class="restart-button"
                    onclick="uiController.restartGame()"
                ></button>
            </div>
            <button
                id="instructions-button-id"
                class="instructions-button"
                onclick="uiController.showInstructions()"
            >
                help
            </button>
            <div id="instructions-id" class="instruction-container hidden">
                <div>
                    <img
                        class="move-button"
                        src="img/6.Botones/Key/arrow keys.png"
                        alt="Beschreibung 1"
                    />
                </div>
                <div><p class="grid-item-text">MOVE SHARK</p></div>
                <div>
                    <img class="d-button" src="img/6.Botones/Key/D key.png" alt="Beschreibung 2" />
                </div>
                <div><p class="grid-item-text">BUBBLE</p></div>
                <div>
                    <img
                        class="spacebar-button"
                        src="img/6.Botones/Key/Space Bar key.png"
                        alt="Beschreibung 3"
                    />
                </div>
                <div><p class="grid-item-text">ATTACK</p></div>
            </div>
        </div>
    </body>
</html>
